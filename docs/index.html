<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Path Editor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="map"></div>
<div class="bar">
  <button id="draw" title="Draw a path (D). Click to place points, double-click or Enter to finish, Esc to cancel." hidden>Draw</button>
  <button id="publish" title="Commit the graph and drawn paths and push them to the GitHub Pages site" hidden>Publish</button>
  <span id="status" role="status"></span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="editor.js"></script>
</body>
</html>
